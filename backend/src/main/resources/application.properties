# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rightfit
spring.datasource.username=Sparsh78.in
spring.datasource.password=Sp@3$%ghgfjd@!(6&)
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false

# JWT Configuration
app.jwt.secret=dev-only-insecure-secret-change-me-32-bytes-minimum-length-required
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Authentication Configuration
app.auth.max-failed-attempts=5
app.auth.lock-duration-minutes=15
app.auth.password.min-length=8
app.auth.password.require-special-chars=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sparsh.freelancehub=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG

# Email Configuration (Disabled by default for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=freelancehubnew@gmail.com
spring.mail.password=xmcerutxqkdnqsfo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.enabled=false
app.mail.from=freelancehubnew@gmail.com

# OTP Configuration
app.otp.expiry-minutes=10
app.otp.length=6

# Frontend Configuration
app.frontend.url=http://localhost:5173

# File Upload Configuration
app.file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=8081
