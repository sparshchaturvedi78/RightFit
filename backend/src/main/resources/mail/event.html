<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f4;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f4;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="background:{{accent}};padding:22px 28px;">
              <span style="font-size:17px;font-weight:800;color:#ffffff;">RightFit</span>
              <span style="display:block;font-size:12px;color:#ffffff;opacity:0.85;margin-top:2px;">Resource allocation</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 4px 28px;">
              <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:{{accent}};">{{eyebrow}}</p>
              <h1 style="margin:8px 0 0 0;font-size:22px;line-height:1.3;color:#0f172a;">{{heading}}</h1>
              <p style="margin:14px 0 0 0;font-size:15px;line-height:1.6;color:#334155;">{{greeting}}</p>
              <p style="margin:8px 0 0 0;font-size:15px;line-height:1.6;color:#334155;">{{intro}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:6px 28px 26px 28px;">
              {{rawBody}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.6;color:#64748b;">
              {{footer}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
