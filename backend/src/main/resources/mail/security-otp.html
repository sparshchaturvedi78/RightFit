<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RightFit security code</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f4;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f4;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="background:#92400e;padding:22px 28px;">
              <span style="font-size:18px;font-weight:800;color:#ffffff;">RightFit</span>
              <span style="display:block;font-size:12px;color:#fde68a;margin-top:2px;">Account security</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#b45309;">{{eyebrow}}</p>
              <h1 style="margin:8px 0 0 0;font-size:22px;line-height:1.3;color:#0f172a;">{{heading}}</h1>
              <p style="margin:12px 0 0 0;font-size:15px;line-height:1.6;color:#334155;">Hi {{firstName}}, {{intro}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fffbeb;border:1px solid #fcd34d;border-radius:14px;">
                <tr>
                  <td align="center" style="padding:22px 12px;">
                    <span style="font-family:Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#92400e;">{{otp}}</span>
                    <p style="margin:12px 0 0 0;font-size:13px;color:#b45309;">Valid for {{expiryMinutes}} minutes, one use only</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:4px 28px 28px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#475569;">
                {{footnote}}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;">
              RightFit will never ask you for this code by phone or chat. This is an automatic message, so please don’t reply.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
